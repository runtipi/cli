name: CI
on:
  pull_request:

jobs:
  build:
    name: Build and Test
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set version in src/assets/VERSION
        run: |
          echo "0.0.0" > src/assets/VERSION

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.2"

      - name: Build Go binary
        run: go build ./cmd/runtipi/main.go

      - name: Run Go tests
        run: go test ./...
